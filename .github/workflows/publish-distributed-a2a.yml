name: Publish distributed-a2a to PyPI

on:
  workflow_dispatch:

jobs:

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6

    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run mypy
      run: |
        make mypy

    - name: Run tests
      run: |
        make test

  build-n-publish:
    name: Build and publish Python 🐍 distribution 📦 to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for trusted publishing
      contents: write

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6

    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6
      with:
        python-version: "3.14"

    - name: Prepare CI dependencies and version
      id: prepare
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[ci]"
        pip install -e "."
        if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
          make bump-patch
        fi
        NEW_VERSION=$(toml get --toml-path pyproject.toml project.version)
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Build wheel and source distribution
      run: |
        pip install build
        python -m build

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Commit bumped version
      if: github.ref == 'refs/heads/main'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Bump version to ${{ steps.prepare.outputs.version }}"
        tag_name: "v${{ steps.prepare.outputs.version }}"
        branch: main
        file_pattern: pyproject.toml
